<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Offline · LearnFlow AI</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    :root { --bg:#f6f7f9; --surface:#fff; --ink:#0f172a; --muted:#5b6678; --border:#e3e8ef; --primary:#0f766e; --soft:#e6f4f2; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0a0f1c; --surface:#111827; --ink:#e6eaf2; --muted:#9aa5b8; --border:#233047; --primary:#2dd4bf; --soft:#0f2e2c; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.6;
      padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px); }
    main { max-width: 680px; margin: 0 auto; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; margin-top:16px; }
    h1 { font-size:1.5rem; margin:16px 0 4px; }
    h2 { font-size:1.05rem; margin:0 0 8px; }
    p.muted, .muted { color:var(--muted); font-size:.92rem; }
    button { font:inherit; border:0; border-radius:12px; padding:12px 18px; background:var(--primary); color:#fff; font-weight:600; cursor:pointer; min-height:44px; }
    button.secondary { background:transparent; color:var(--ink); border:1px solid var(--border); }
    ul { padding-left:1.2rem; }
    .lesson-item { display:block; width:100%; text-align:left; background:transparent; color:var(--ink); border:1px solid var(--border); margin-top:8px; }
    .pill { display:inline-block; background:var(--soft); color:var(--primary); border-radius:999px; padding:2px 10px; font-size:.8rem; font-weight:600; }
    .logo { display:flex; align-items:center; gap:8px; font-weight:700; }
    .logo img { width:32px; height:32px; border-radius:8px; }
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="/icons/icon-192.png" alt="" /> LearnFlow AI</div>
    <h1>You're offline</h1>
    <p class="muted">LearnFlow needs a connection for AI lessons, quizzes, the tutor and syncing your progress. Lessons you saved for offline reading are available below.</p>
    <p><button id="retry">Try again</button></p>
    <p id="queue" class="muted" hidden></p>

    <section class="card" id="saved-section">
      <h2>Saved for offline</h2>
      <div id="saved"><p class="muted">Loading…</p></div>
    </section>

    <section class="card" id="reader" hidden>
      <p><button class="secondary" id="back">← Back to saved lessons</button></p>
      <div id="reader-body"></div>
    </section>
  </main>
  <script>
    (function () {
      // Rendered with textContent only, so stored content can never inject markup.
      function el(tag, text, cls) { var n = document.createElement(tag); if (text) n.textContent = text; if (cls) n.className = cls; return n; }
      function read(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }

      document.getElementById("retry").addEventListener("click", function () { location.reload(); });
      window.addEventListener("online", function () { location.reload(); });

      var queue = read("lf-sync-queue");
      if (Array.isArray(queue) && queue.length) {
        var q = document.getElementById("queue");
        q.hidden = false;
        q.textContent = queue.length + " learning " + (queue.length === 1 ? "activity is" : "activities are") + " waiting to sync. They will be sent automatically when you reconnect.";
      }

      var saved = read("lf-saved-lessons") || {};
      var list = document.getElementById("saved");
      var ids = Object.keys(saved);
      list.textContent = "";
      if (!ids.length) {
        list.appendChild(el("p", "No lessons saved yet. Open a lesson while online and tap “Save for offline”.", "muted"));
      }
      ids.sort(function (a, b) { return (saved[b].savedAt || "").localeCompare(saved[a].savedAt || ""); }).forEach(function (id) {
        var item = saved[id];
        var b = el("button", null, "lesson-item");
        b.appendChild(el("strong", item.title));
        b.appendChild(el("div", item.journeyTitle || "", "muted"));
        b.addEventListener("click", function () { openLesson(item); });
        list.appendChild(b);
      });

      function section(parent, title, items) {
        if (!items || !items.length) return;
        parent.appendChild(el("h2", title));
        var ul = el("ul");
        items.forEach(function (t) { ul.appendChild(el("li", t)); });
        parent.appendChild(ul);
      }

      function openLesson(item) {
        var c = item.content || {};
        var body = document.getElementById("reader-body");
        body.textContent = "";
        body.appendChild(el("span", item.journeyTitle || "Saved lesson", "pill"));
        body.appendChild(el("h1", c.title || item.title));
        section(body, "Objectives", c.objectives);
        body.appendChild(el("h2", "Explanation"));
        String(c.explanation || "").split(/\n\s*\n/).forEach(function (p) { body.appendChild(el("p", p.replace(/\*\*/g, ""))); });
        section(body, "Key terms", (c.keyTerms || []).map(function (t) { return t.term + " — " + t.definition; }));
        section(body, "Analogies", c.analogies);
        section(body, "Examples", (c.examples || []).map(function (e) { return e.title + ": " + e.body; }));
        section(body, "Step by step", (c.steps || []).map(function (s) { return s.title + " — " + s.detail; }));
        section(body, "Recap", c.recap);
        if (c.disclaimer) body.appendChild(el("p", c.disclaimer, "muted"));
        body.appendChild(el("p", "Quizzes and progress tracking need a connection.", "muted"));
        document.getElementById("saved-section").hidden = true;
        document.getElementById("reader").hidden = false;
        window.scrollTo(0, 0);
      }
      document.getElementById("back").addEventListener("click", function () {
        document.getElementById("reader").hidden = true;
        document.getElementById("saved-section").hidden = false;
      });
    })();
  </script>
</body>
</html>
